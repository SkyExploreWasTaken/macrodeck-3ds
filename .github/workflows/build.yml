name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to publish, like v1.0.0 (tags the current commit). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version of nightly builds

      - name: Install CIA tools (makerom, bannertool)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq unzip curl jq git g++ make >/dev/null
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest"; }
          mkdir -p /tmp/tools && cd /tmp/tools
          # The prebuilt makerom needs a newer glibc than this container has, so build it from the latest release's source.
          tag=$(api 3DSGuy/Project_CTR | jq -r '.tag_name')
          echo "makerom: Project_CTR $tag"
          git clone -q --depth 1 --branch "$tag" https://github.com/3DSGuy/Project_CTR.git ctr
          make -C ctr/makerom deps >/dev/null
          make -C ctr/makerom -j"$(nproc)" >/dev/null
          install -m755 "$(find ctr/makerom -type f -name makerom -perm -u+x | head -n1)" /usr/local/bin/makerom
          url=$(api Epicpkmn11/bannertool | jq -r '.assets[].browser_download_url' | grep -i '\.zip$' | head -n1)
          echo "bannertool: $url"
          curl -fsSL -o bannertool.zip "$url" && unzip -o -q bannertool.zip -d bannertool
          install -m755 "$(find bannertool -type f -path '*linux-x86_64*' -name bannertool | head -n1)" /usr/local/bin/bannertool
          makerom -version || true

      - name: Pick the version
        id: ver
        env:
          INPUT: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          case "$GITHUB_REF" in refs/tags/v*) tag="${GITHUB_REF#refs/tags/}" ;; *) tag= ;; esac
          if [ -n "$INPUT" ]; then v="$INPUT"; suffix=
          elif [ -n "$tag" ]; then v="$tag"; suffix=
          else v=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v1.0.0); suffix=-nightly
          fi
          echo "Building ${v#v}$suffix"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Build .3dsx
        run: make -j"$(nproc)" VERSION="${{ steps.ver.outputs.version }}" VERSION_SUFFIX="${{ steps.ver.outputs.suffix }}"

      - name: Build .cia
        run: make cia VERSION="${{ steps.ver.outputs.version }}" VERSION_SUFFIX="${{ steps.ver.outputs.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MacroDeck3DS
          path: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia

      - name: Replace the nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete and recreate it so the release list shows it as new, with this build's commit and date.
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/nightly" | jq -r .id) || id=
          if [ -n "$id" ] && [ "$id" != null ]; then
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$id"
          fi
          git tag -f nightly
          git push -f origin refs/tags/nightly
          echo "short=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build ${{ steps.nightly.outputs.short }} (${{ steps.nightly.outputs.date }})
          prerelease: true
          body: |
            Latest build of main, commit ${{ steps.nightly.outputs.short }}. The app shows this commit at the bottom right of the top screen.
            Install the .cia with FBI (or scan the QR code in the README), or put the .3dsx in sdmc:/3ds/.
          files: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia

      - name: Tag the stable release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version must look like v1.2.3, got '$VERSION'"; exit 1 ;;
          esac
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Stable release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Macro Deck for 3DS ${{ inputs.version }}
          make_latest: true
          body: |
            Stable release, built from commit ${{ github.sha }}.

            **Install:** scan the QR code in the README with FBI (Remote Install > Scan QR Code), or copy the `.cia` to
            your SD card and install it with FBI. For the Homebrew Launcher, put the `.3dsx` in `sdmc:/3ds/`.

            Licensed under the GPL-3.0. See the README for connecting to Macro Deck, and THIRD_PARTY_NOTICES.md for the
            bundled libraries' licenses.
          files: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia
            LICENSE
            THIRD_PARTY_NOTICES.md
