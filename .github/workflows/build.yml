name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CIA tools (makerom, bannertool)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq unzip curl jq git g++ make >/dev/null
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest"; }
          mkdir -p /tmp/tools && cd /tmp/tools
          # The prebuilt makerom needs a newer glibc than this container has, so build it from the latest release's source.
          tag=$(api 3DSGuy/Project_CTR | jq -r '.tag_name')
          echo "makerom: Project_CTR $tag"
          git clone -q --depth 1 --branch "$tag" https://github.com/3DSGuy/Project_CTR.git ctr
          make -C ctr/makerom deps >/dev/null
          make -C ctr/makerom -j"$(nproc)" >/dev/null
          install -m755 "$(find ctr/makerom -type f -name makerom -perm -u+x | head -n1)" /usr/local/bin/makerom
          url=$(api Epicpkmn11/bannertool | jq -r '.assets[].browser_download_url' | grep -i '\.zip$' | head -n1)
          echo "bannertool: $url"
          curl -fsSL -o bannertool.zip "$url" && unzip -o -q bannertool.zip -d bannertool
          install -m755 "$(find bannertool -type f -path '*linux-x86_64*' -name bannertool | head -n1)" /usr/local/bin/bannertool
          makerom -version || true

      - name: Build .3dsx
        run: make -j"$(nproc)"

      - name: Build .cia
        run: make cia

      - uses: actions/upload-artifact@v4
        with:
          name: MacroDeck3DS
          path: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia

      - name: Move the nightly tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f nightly
          git push -f origin refs/tags/nightly

      - name: Nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          body: Latest build of main (${{ github.sha }}). Install the .cia with FBI, or put the .3dsx in sdmc:/3ds/.
          files: |
            MacroDeck3DS.3dsx
            MacroDeck3DS.cia
